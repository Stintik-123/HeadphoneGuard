name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/HeadphoneGuard/HeadphoneGuard.csproj

      - name: Build
        run: dotnet build src/HeadphoneGuard/HeadphoneGuard.csproj -c Release --no-restore

      - name: Publish (framework-dependent)
        run: dotnet publish src/HeadphoneGuard/HeadphoneGuard.csproj -c Release -r win-x64 --self-contained false -o artifacts/portable

      - name: Publish (self-contained)
        run: dotnet publish src/HeadphoneGuard/HeadphoneGuard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/self-contained

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeadphoneGuard-windows
          path: artifacts/
